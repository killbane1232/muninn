name: build

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: muninn_test
          POSTGRES_PASSWORD: muninn_test
          POSTGRES_DB: muninn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muninn_test -d muninn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MUNINN_TEST_POSTGRES_DSN: postgres://muninn_test:muninn_test@localhost:5432/muninn_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go test ./...

  publish:
    needs: test
    if: github.event_name == 'push'
    strategy:
      matrix:
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/${{ matrix.arch }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.run_number }}-${{ matrix.arch }}
            ghcr.io/${{ github.repository }}:latest-${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
